# Insert this location inside the HTTPS
# `server_name admin.assetinsightvaluator.com` server block.
#
# The browser sends one authenticated image/video to the Next.js BFF, which
# streams it to the backend and R2. Disabling both request and response
# buffering keeps progress truthful and avoids staging a 250 MiB video on the
# shared Nginx host. The `upload_per_ip` zone is declared in nginx.conf.
location ~ ^/api/admin/support/conversations/[^/]+/attachments/upload$ {
    client_max_body_size 260m;
    limit_conn upload_per_ip 8;

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    proxy_next_upstream off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}
